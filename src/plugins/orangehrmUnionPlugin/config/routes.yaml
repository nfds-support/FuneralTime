apiv2_union_unions:
  path: /api/v2/union/unions
  controller: OrangeHRM\Core\Controller\Rest\V2\GenericRestController::handle
  methods: [ GET, POST, DELETE ]
  defaults:
    _api: OrangeHRM\Union\Api\UnionAPI

apiv2_union_union:
  path: /api/v2/union/unions/{id}
  controller: OrangeHRM\Core\Controller\Rest\V2\GenericRestController::handle
  methods: [ GET, PUT ]
  defaults:
    _api: OrangeHRM\Union\Api\UnionAPI
    _key: id
  requirements:
    id: '\d+'

apiv2_union_employee_unions:
  path: /api/v2/union/employee-unions
