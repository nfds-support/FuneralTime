time_schedule:
  description: 'Time - Employee Schedule'
  allowed:
    read: true
    create: true
    update: true
    delete: false
  permissions:
    - { role: Admin, permission: { read: true, create: true, update: true, delete: false, self: false } }
    - { role: Supervisor, permission: { read: true, create: false, update: false, delete: false, self: false } }
    - { role: ESS, permission: { read: false, create: false, update: false, delete: false, self: false } }
