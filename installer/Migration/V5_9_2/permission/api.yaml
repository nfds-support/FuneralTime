apiv2_time_payroll_periods:
  description: 'API-v2 Time - Payroll Periods'
  api: OrangeHRM\Time\Api\PayrollPeriodAPI
  module: time
  allowed:
    read: true
    create: true
    update: true
    delete: true
  permissions:
    - { role: Admin, permission: { read: true, create: true, update: true, delete: true } }
    - { role: Supervisor, permission: { read: true, create: false, update: false, delete: false } }

apiv2_time_payroll_fill_sheet:
  description: 'API-v2 Time - Payroll Fill Sheet Report'
  api: OrangeHRM\Time\Api\PayrollFillSheetAPI
  module: time
  allowed:
    read: true
    create: false
    update: false
    delete: false
  permissions:
    - { role: Admin, permission: { read: true, create: false, update: false, delete: false } }
    - { role: Supervisor, permission: { read: true, create: false, update: false, delete: false } }

apiv2_leave_entitlement_transactions:
  description: 'API-v2 Leave - Entitlement Transaction History'
  api: OrangeHRM\Leave\Api\LeaveEntitlementTransactionAPI
  module: leave
  allowed:
    read: true
    create: true
    update: false
    delete: false
  permissions:
    - { role: Admin, permission: { read: true, create: true, update: false, delete: false } }
    - { role: Supervisor, permission: { read: true, create: false, update: false, delete: false } }
    - { role: ESS, permission: { read: true, create: false, update: false, delete: false, self: true } }
