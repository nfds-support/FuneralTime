'View Policy Module':
  module: policy
  url: viewPolicyModule
  permissions:
    - { role: Admin, permission: { read: true } }
    - { role: ESS, permission: { read: true, create: false, update: false, delete: false } }

'Policies':
  module: policy
  url: viewPolicies
  permissions:
    - { role: Admin, permission: { read: true, create: true, update: true, delete: true } }
    - { role: ESS, permission: { read: false, create: false, update: false, delete: false } }

'Save Policy':
  module: policy
  url: savePolicy
  permissions:
    - { role: Admin, permission: { read: true, create: true, update: true, delete: false } }
    - { role: ESS, permission: { read: false, create: false, update: false, delete: false } }

'Edit Policy':
  module: policy
  url: editPolicy/{id}
  permissions:
    - { role: Admin, permission: { read: true, create: true, update: true, delete: false } }
    - { role: ESS, permission: { read: false, create: false, update: false, delete: false } }

'Policy Acknowledgments':
  module: policy
  url: viewPolicyAcknowledgments/{id}
  permissions:
    - { role: Admin, permission: { read: true, create: false, update: false, delete: false } }
    - { role: ESS, permission: { read: false, create: false, update: false, delete: false } }

'My Policies':
  module: policy
  url: viewMyPolicies
  permissions:
    - { role: Admin, permission: { read: true, create: true, update: false, delete: false } }
    - { role: ESS, permission: { read: true, create: true, update: false, delete: false } }

'Learning':
  module: policy
  url: viewLearning
  permissions:
    - { role: Admin, permission: { read: true } }
    - { role: ESS, permission: { read: true, create: false, update: false, delete: false } }

'Moodle Settings':
  module: policy
  url: moodleConfig
  permissions:
    - { role: Admin, permission: { read: true, create: true, update: true, delete: false } }
    - { role: ESS, permission: { read: false, create: false, update: false, delete: false } }
