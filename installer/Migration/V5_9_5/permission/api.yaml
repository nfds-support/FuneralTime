apiv2_policy_policies:
  description: 'API-v2 Policy - Policies'
  api: OrangeHRM\Policy\Api\PolicyAPI
  module: policy
  allowed: { read: true, create: true, update: true, delete: true }
  permissions:
    - { role: Admin, permission: { read: true, create: true, update: true, delete: true, self: false } }
    - { role: ESS, permission: { read: false, create: false, update: false, delete: false, self: false } }

apiv2_policy_my_policies:
  description: 'API-v2 Policy - My Policies'
  api: OrangeHRM\Policy\Api\MyPolicyAPI
  module: policy
  allowed: { read: true, create: true, update: false, delete: false }
  permissions:
    - { role: Admin, permission: { read: true, create: true, update: false, delete: false, self: true } }
    - { role: ESS, permission: { read: true, create: true, update: false, delete: false, self: true } }

apiv2_policy_acknowledgments:
  description: 'API-v2 Policy - Acknowledgments'
  api: OrangeHRM\Policy\Api\PolicyAcknowledgmentAPI
  module: policy
  allowed: { read: true, create: false, update: false, delete: false }
  permissions:
    - { role: Admin, permission: { read: true, create: false, update: false, delete: false, self: false } }
    - { role: ESS, permission: { read: false, create: false, update: false, delete: false, self: false } }

apiv2_policy_moodle_cohort_maps:
  description: 'API-v2 Policy - Moodle Cohort Maps'
  api: OrangeHRM\Policy\Api\MoodleCohortMapAPI
  module: policy
  allowed: { read: true, create: true, update: true, delete: true }
  permissions:
    - { role: Admin, permission: { read: true, create: true, update: true, delete: true, self: false } }
    - { role: ESS, permission: { read: false, create: false, update: false, delete: false, self: false } }

apiv2_policy_moodle_config:
  description: 'API-v2 Policy - Moodle Config'
  api: OrangeHRM\Policy\Api\MoodleConfigAPI
  module: policy
  allowed: { read: true, create: false, update: true, delete: false }
  permissions:
    - { role: Admin, permission: { read: true, create: false, update: true, delete: false, self: false } }
    - { role: ESS, permission: { read: false, create: false, update: false, delete: false, self: false } }
