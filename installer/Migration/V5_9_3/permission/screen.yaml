'Employee Expense Limits':
  module: claim
  url: viewEmployeeExpenseLimits
  permissions:
    - { role: Admin, permission: { read: true, create: true, update: true, delete: true } }
    - { role: Supervisor, permission: { read: true, create: false, update: false, delete: false } }

'Monthly Expense Report':
  module: claim
  url: viewMonthlyExpenseReport
  permissions:
    - { role: Admin, permission: { read: true } }
    - { role: Supervisor, permission: { read: true } }
    - { role: ESS, permission: { read: true } }
