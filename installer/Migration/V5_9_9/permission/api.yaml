apiv2_performance_monthly_assessments:
  description: 'API-v2 Performance - Monthly Assessments'
  api: OrangeHRM\Performance\Api\MonthlyAssessmentAPI
  module: performance
  allowed: { read: true, create: true, update: true, delete: true }
  permissions:
    - { role: Admin, permission: { read: true, create: true, update: true, delete: true } }
    - { role: Supervisor, permission: { read: true, create: true, update: true, delete: false } }
    - { role: ESS, permission: { read: true, create: true, update: true, delete: false, self: true } }
